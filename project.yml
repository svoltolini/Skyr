name: Skyr
options:
  bundleIdPrefix: com.samuelvoltolini
  deploymentTarget:
    iOS: "26.1"
    macOS: "26.0"
    tvOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  SkyrCore:
    path: Packages/SkyrCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    CODE_SIGN_STYLE: Automatic
targets:
  Skyr:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: Skyr
    dependencies:
      - target: SkyrWidgets
      - target: SkyrWatch
      - package: SkyrCore
        product: SkyrCore
      - package: SkyrCore
        product: SkyrShared
    entitlements:
      path: Skyr/Skyr.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samuelvoltolini.skyr
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.skyr
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        # Approved by Apple; the App ID and signing profile must include this managed capability.
        com.apple.developer.carplay-audio: true
    info:
      path: Skyr/Info.plist
      properties:
        CFBundleDisplayName: Skyr Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.samuelvoltolini.skyr
            CFBundleURLSchemes:
              - skyr
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          # The car's screen is a second scene beside the phone's.
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            CPTemplateApplicationSceneSessionRoleApplication:
              - UISceneClassName: CPTemplateApplicationScene
                UISceneConfigurationName: CarPlay
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).CarPlaySceneDelegate
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        # Without this the system never hands a family invitation link to the app: Safari opens it and calls it invalid.
        CKSharingSupported: true
        NSLocalNetworkUsageDescription: Skyr looks for music servers on your local network.
        NSFaceIDUsageDescription: Face ID opens your profile without typing its PIN.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSSupportsLiveActivities: true
        UIBackgroundModes:
          - audio
          - remote-notification
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.samuelvoltolini.skyr.index
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.skyr
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Skyr
        TARGETED_DEVICE_FAMILY: "1,2"
        # The Mac has its own native app (SkyrMac); the iPhone/iPad build must not be offered on Macs.
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        INFOPLIST_KEY_UIUserInterfaceStyle: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609142035"
  SkyrWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: SkyrWidgets
      - path: Skyr/Shared
    dependencies:
      - package: SkyrCore
        product: SkyrShared
    entitlements:
      path: SkyrWidgets/SkyrWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.samuelvoltolini.skyr
    info:
      path: SkyrWidgets/Info.plist
      properties:
        CFBundleDisplayName: Skyr Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.skyr.widgets
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: SkyrWidgets
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: "NO"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609142035"
  SkyrWatch:
    type: application
    platform: watchOS
    deploymentTarget: "26.0"
    sources:
      - path: SkyrWatch
      - path: Skyr/Assets.xcassets
    dependencies:
      - package: SkyrCore
        product: SkyrCore
    info:
      path: SkyrWatch/Info.plist
      properties:
        CFBundleDisplayName: Skyr
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.samuelvoltolini.skyr
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: Skyr downloads playlists from your music server on the local network.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.skyr.watchkitapp
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Skyr
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: WatchAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        SKIP_INSTALL: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609142035"
  SkyrMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: SkyrMac
      - path: Skyr/Views
        excludes:
          - "Main/**"
      - path: Skyr/Theme
      - path: Skyr/Assets.xcassets
    dependencies:
      - package: SkyrCore
        product: SkyrCore
    entitlements:
      path: SkyrMac/SkyrMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.skyr
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: SkyrMac/Info.plist
      properties:
        CFBundleDisplayName: Skyr Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSApplicationCategoryType: public.app-category.music
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: © Samuel Voltolini
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLName: com.samuelvoltolini.skyr
            CFBundleURLSchemes:
              - skyr
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Skyr looks for music servers on your local network.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.skyr
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Skyr
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: macosx
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609142035"
  SkyrTV:
    type: application
    platform: tvOS
    deploymentTarget: "26.0"
    sources:
      - path: SkyrTV
      - path: Skyr/Views
        excludes:
          - "Main/**"
      - path: Skyr/Theme
      - path: Skyr/Assets.xcassets
    dependencies:
      - package: SkyrCore
        product: SkyrCore
    entitlements:
      path: SkyrTV/SkyrTV.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.samuelvoltolini.skyr
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    info:
      path: SkyrTV/Info.plist
      properties:
        CFBundleDisplayName: Skyr Music
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Skyr looks for music servers on your local network.
        NSBonjourServices:
          - _http._tcp
          - _smb._tcp
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.samuelvoltolini.skyr
        DEVELOPMENT_TEAM: C6GW4A76XK
        PRODUCT_NAME: Skyr
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: TVIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "202609142035"
